[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-lang"
dynamic = ["version"]
description = "An agent-native language with a reliable Python runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{name = "Nexa Core Team"}]
dependencies = [
    "lark>=1.3.1,<2",
    "openai>=2.28,<3",
    "pydantic>=2.12.5,<3",
    "tenacity>=9.1.4,<10",
    "PyYAML>=6,<7",
    "PyJWT>=2.8,<3",
    "requests>=2.31,<3",
    "jsonschema>=4.25.1,<5",
    "referencing>=0.36,<1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.1,<3"]
terminal = ["prompt_toolkit>=3,<4", "rich>=13,<16"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
nexa = "src.cli:main"

[dependency-groups]
dev = [
    "build>=1.2,<2", "setuptools>=77", "wheel>=0.45",
    "pytest>=8,<10", "pytest-timeout>=2.3,<3", "pytest-socket>=0.7,<1",
    "ruff>=0.17,<0.18", "isort>=8,<10", "ty>=0.0.90,<0.1",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["src", "src.*", "stdlib"]

[tool.setuptools.package-data]
stdlib = ["*.nx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket"
timeout = 30
markers = [
    "benchmark: timing or resource benchmarks, separate from deterministic correctness checks",
    "integration: explicitly configured external service or local server integration",
]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.isort]
profile = "black"
line_length = 160

[tool.ty.environment]
python-version = "3.10"
